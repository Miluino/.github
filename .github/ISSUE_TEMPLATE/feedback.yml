name: Обратная связь по проверке
description: Зафиксируйте выявленное замечание.
title: "Замечание: "
body:
  - type: textarea
    id: observation
    attributes:
      label: Выявленное замечание
      description: Опишите проблему, несоответствие или риск.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
      description: Опишите, как должно быть после исправления.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Дополнительная информация
      description: Добавьте ссылки, скриншоты, фотографии или рекомендации по исправлению.
