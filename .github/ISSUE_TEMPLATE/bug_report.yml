name: Сообщение об ошибке
description: Сообщите о воспроизводимой проблеме в коде, документации или оборудовании.
title: "Ошибка: "
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение. Укажите достаточно данных, чтобы другой участник
        команды мог воспроизвести и проверить проблему.
  - type: textarea
    id: problem
    attributes:
      label: Что произошло
      description: Кратко опишите фактический результат.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
      description: Опишите, что должно было произойти.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Как воспроизвести
      description: Перечислите шаги, входные данные, версию прошивки и условия эксперимента.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Дополнительная информация
      description: Логи, фотографии, ссылки на схему, сообщения об ошибках и другие материалы.
