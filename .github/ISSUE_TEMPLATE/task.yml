name: Задача
description: Создайте техническую, документационную, исследовательскую или организационную задачу.
title: "Задача: "
body:
  - type: textarea
    id: goal
    attributes:
      label: Цель
      description: Какой результат должен быть получен?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Что нужно сделать
      description: Опишите основные шаги и границы задачи.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Критерии готовности
      description: Перечислите признаки завершённой работы.
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Дополнительная информация
      description: Ссылки, схемы, ограничения, зависимости или результаты исследования.
